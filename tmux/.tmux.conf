# .tmux.conf
# Modernized version of farneman/mytmux.conf
# Structure, prefix, and keybindings preserved; plugin list updated.

# reattach-to-user-namespace is no longer needed on modern macOS/tmux --
# pbcopy/pbpaste work directly. Left out on purpose.

# Screen-style prefix (unchanged from the original)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# start window index at 1 (unchanged)
set -g base-index 1

# Lower escape-time so Neovim doesn't lag after <Esc> -- this was commented
# out in the old config but is worth turning on now; Neovim is more
# sensitive to this than old MacVim-in-terminal was.
set -sg escape-time 10

# vi-style copy mode (unchanged)
set-window-option -g mode-keys vi

# True color support for modern terminals/Neovim
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

### Keybindings (unchanged from the original) ###
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind-key -r C-h select-window -t :-
bind-key -r C-l select-window -t :+
bind-key C-a last-window

bind-key e select-window -t editor
bind-key v select-window -t vim

bind-key | split-window -h
bind-key \\ split-window -h
bind-key - split-window -v
bind-key _ split-window -v -p 25
bind-key / split-window -h -p 33

bind-key T join-pane -ht vim -p 33
bind-key V join-pane -ht vim -p 33

bind-key b break-pane -d
bind-key x kill-pane
bind-key X kill-window
bind-key q confirm-before kill-session
bind-key Q confirm-before kill-server

bind-key , previous-window
bind-key . next-window
bind-key -r < swap-window -t :-
bind-key -r > swap-window -t :+

bind-key n command-prompt 'rename-window %%'
bind-key N command-prompt 'rename-session %%'

bind-key Escape copy-mode -u
bind-key Up copy-mode -u

bind-key r source-file ~/.tmux.conf \; display-message " tmux.conf reloaded"
bind-key R refresh-client

bind-key a send-key C-a
bind-key S set-option status

bind-key J resize-pane -D 5
bind-key K resize-pane -U 5
bind-key H resize-pane -L 5
bind-key L resize-pane -R 5
bind-key M-j resize-pane -D
bind-key M-k resize-pane -U
bind-key M-h resize-pane -L
bind-key M-l resize-pane -R

# Copy mode keybindings -- `bind -t vi-copy` is gone in modern tmux
# (tmux >= 2.4 uses copy-mode-vi key tables instead)
unbind p
bind p paste-buffer
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

setw -g monitor-activity on
set -g visual-activity on

### tmux-resurrect / tmux-continuum ###
set -g @resurrect-save-bash-history 'on'
set -g @resurrect-capture-pane-contents 'on'

# No more @resurrect-strategy-vim -- that option told resurrect to restore
# a specific Session.vim file written by :Obsession. Session management now
# lives entirely on the Neovim side via persistence.nvim (see
# nvim/lua/plugins/session.lua), which auto-saves per project directory and
# auto-restores on a bare `nvim` launch. So resurrect's job here simplifies
# to just: "relaunch nvim in this pane, in this directory" -- persistence.nvim
# picks the session back up from there, no coordination needed.
set -g @resurrect-processes 'nvim'

set -g @continuum-restore 'on'
set -g @continuum-boot 'on'
set -g @continuum-boot-options 'fullscreen'

### Plugins ###
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-copycat'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Initialize TMUX plugin manager (keep this line at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
